# Builds the Android APK and an UNSIGNED iPhone .ipa on every push to main (or from the
# Actions tab → "Run workflow") and publishes both on the repository's Releases page.
#   • Android: install the .apk directly ("install unknown apps" must be allowed).
#   • iPhone: sideload the .ipa with Sideloadly / AltStore, which sign it with your Apple ID.
# Public repositories get these build minutes free.
name: Build apps (Android APK + iPhone IPA)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**.md', '.env.example', 'scripts/make_markers.py']

permissions:
  contents: write # lets the release job publish the downloads

concurrency:
  group: build-apps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup /usr/local/share/boost

      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: gradle/actions/setup-gradle@v4

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the Android project
        run: CI=1 npx expo prebuild --platform android --clean

      - name: Build release APK
        working-directory: android
        env:
          NODE_ENV: production
        run: |
          sed -i 's/^org.gradle.jvmargs=.*/org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=1g/' gradle.properties
          ./gradlew assembleRelease -PreactNativeArchitectures=armeabi-v7a,arm64-v8a,x86_64

      - name: Name the APK
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p dist
          cp android/app/build/outputs/apk/release/app-release.apk "dist/UK-LifeDrop-AED-$VERSION.apk"
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: UK-LifeDrop-AED-apk
          path: dist/*.apk
          retention-days: 30

  ios:
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JavaScript dependencies
        run: npm ci

      - name: Generate the iOS project
        run: CI=1 npx expo prebuild --platform ios --clean

      - name: Install CocoaPods
        working-directory: ios
        run: pod install

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -workspace ios/UKLifeDropAED.xcworkspace \
            -scheme UKLifeDropAED \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -archivePath build/UKLifeDropAED.xcarchive \
            -skipPackagePluginValidation \
            archive \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" DEVELOPMENT_TEAM="" \
            | tail -n 200

      - name: Package .ipa
        run: |
          VERSION=$(node -p "require('./package.json').version")
          mkdir -p build/Payload dist
          cp -R build/UKLifeDropAED.xcarchive/Products/Applications/UKLifeDropAED.app build/Payload/
          (cd build && zip -qry "../dist/UK-LifeDrop-AED-$VERSION-unsigned.ipa" Payload)
          ls -lh dist

      - uses: actions/upload-artifact@v4
        with:
          name: UK-LifeDrop-AED-ipa
          path: dist/*.ipa
          retention-days: 30

  release:
    needs: [android, ios]
    # Publish whatever built, even if the other platform failed.
    if: ${{ !cancelled() && (needs.android.result == 'success' || needs.ios.result == 'success') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false

      - name: Read version
        run: echo "APP_VERSION=$(node -p "require('./package.json').version")" >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - run: ls -lh dist

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          name: LifeDrop AED ${{ env.APP_VERSION }} (build ${{ github.run_number }})
          make_latest: true
          files: dist/*
          body: |
            **Android** – download the `.apk` and open it on the phone (allow "install unknown apps" when asked). Installs over earlier versions.
            **iPhone** – download the `-unsigned.ipa` and install it with Sideloadly or AltStore (iOS 16.4 or later; free Apple IDs need re-signing every 7 days).

            Android build: ${{ needs.android.result }} · iPhone build: ${{ needs.ios.result }}

            In a cardiac emergency, always call 999 first.
